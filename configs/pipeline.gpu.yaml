# TREC RAG 2026 pipeline configuration — real backends on local GPUs + Ollama.
#
# configs/pipeline.yaml stays as the zero-setup default that runs anywhere on
# fallback backends. This is the submission config: every stage that has a real
# backend uses it. Run with `--config configs/pipeline.gpu.yaml`.
#
# Requires .env.local with PYSERINI_API_TOKEN, and Ollama serving on
# localhost:11434 (its OpenAI-compatible route is /v1).

pyserini:
  base_url: "http://api.castorini.uwaterloo.ca"
  index: "climbmix-400b"
  token_env: "PYSERINI_API_TOKEN"
  timeout_seconds: 60
  max_retries: 6
  # The API is rate-limited. Retries honour Retry-After and otherwise back off
  # 2s, 4s, 8s, ... so a 429 burst waits rather than hammering.
  backoff_factor: 2.0
  # Search responses are cached by (index, query, hits) so a resumed or repeated
  # run never re-hits shared track infrastructure. Measured at ~63 MB per
  # topic (ClimbMix returns whole documents), so budget ~7.5 GB for all 119.
  cache_dir: "/media/12TB/shared/datasets/trec/trec-rag-2026/pyserini_cache"

stages:
  bm25:
    # The cache key includes `hits`, so changing this invalidates every cached
    # payload and re-issues 119 x 1000-hit searches. Pin it.
    hits: 1000

  # ClimbMix documents are whole pages/books: measured mean 66,685 chars,
  # median 42,948, and NOT ONE of 1000 candidates was under 2000 chars. Every
  # downstream stage truncates its input, so without this they all score and
  # cite each document's title page. Measured over 200 real candidates: the
  # leading window was the best window in only 10/200 docs, the median best
  # window began at char 15,900, and selecting it raised query overlap 32%.
  # CPU-only, ~1.7s per 1000-candidate topic.
  passage_selection:
    enabled: true
    window_chars: 2000        # ~512 tokens, matching the e5/CE input limits
    stride_chars: 1000
    windows_per_doc: 2        # narratives are multi-faceted; one span rarely covers them
    min_doc_chars: 2000       # already passage-sized: leave untouched

  biencoder:
    enabled: true
    backend: sentence_transformer
    model_name: "intfloat/e5-base-v2"
    # E5 is trained with these markers; omitting them measurably costs accuracy.
    query_prefix: "query: "
    passage_prefix: "passage: "
    device: "cuda"
    batch_size: 128
    dims: 768
    pool_size: 1000

  hybrid:
    rrf_k: 60
    top_k: 500

  ltr:
    enabled: true
    model_path: null            # no dev qrels trained yet -> linear fallback
    feature_names: ["bm25_score", "bm25_rank", "bien_score", "bien_rank", "rrf_score"]
    weights:
      bm25_score: 0.25
      bien_score: 0.25
      rrf_score: 0.5
    top_k: 500                  # reorder the whole RRF pool; don't discard yet

  colbert:
    # DISABLED deliberately. There is no real ColBERT backend available here:
    # no checkpoint is cached, and loading colbert-ir/colbertv2.0 through
    # AutoModel would skip its projection head and score raw BERT hidden states
    # while calling it ColBERT. Its only remaining function would be to prune
    # the pool with lexical token overlap *before* the strongest scorer sees it.
    # Batched, the cross-encoder handles 500 candidates in 0.24s, so that
    # pruning buys no time and can only lose recall. `top_k` is kept at the pool
    # size so the disabled stage truncates nothing.
    enabled: false
    backend: hashing
    model_name: null
    device: "cuda"
    batch_size: 32
    max_query_tokens: 32
    max_doc_tokens: 180
    top_k: 500

  # QDER, unlike ColBERT, is NOT disabled: no trained checkpoint exists yet
  # either (stages.qder.model_path is null below), but its hashing fallback is
  # this branch's actual differentiator and there is a real path to a trained
  # checkpoint (scripts/prepare_qder_data.py + third_party/qder_training/train.py) --
  # unlike ColBERT, where no such path exists in this repo at all. Same
  # weak-signal-reorders-doesn't-discard logic as LTR above applies here:
  # top_k is kept at the pool size so an untrained scorer can influence order
  # without being trusted to prune ahead of the real cross-encoder.
  qder:
    enabled: true
    backend: hashing            # hashing | transformer
    model_name: "bert-base-uncased"   # only used when backend: transformer
    model_path: null            # trained checkpoint from third_party/qder_training/train.py (unwrapped, see its README); null = untrained
    score_method: bilinear      # linear | bilinear (transformer backend only)
    use_entities: false         # entity channel needs an EntityEmbeddingProvider (no WAT/Wikipedia2Vec for ClimbMix here)
    entity_provider: heuristic  # none | heuristic (only used if use_entities: true)
    bm25_feature_name: bm25_score
    hybrid_lambda: 0.5          # score_hybrid = lambda*bm25 + (1-lambda)*qder
    max_query_tokens: 32
    max_doc_tokens: 256
    top_k: 500                  # reorder the whole pool; don't discard on an untrained scorer

  cross_encoder:
    enabled: true
    backend: sentence_transformer
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    device: "cuda"
    batch_size: 64
    top_k: 50                   # the set handed to listwise reranking + the R run

  llm_listwise:
    enabled: true
    backend: openai             # Ollama's OpenAI-compatible endpoint
    model_env: "LLM_LISTWISE_MODEL"
    window_size: 20
    step: 10
    # Raised from 300 now that passage_selection guarantees these chars are the
    # query-relevant span rather than the document's opening boilerplate.
    max_passage_chars: 1200
    # Reorders all 50 and returns all 50: truncation here would silently cap the
    # R run. Same number of sliding windows either way, so this costs nothing.
    top_k: 50

retrieval_output:
  filename: "r_output_trec_rag_2026.tsv"
  # The R task wants a per-narrative k of "all and only" useful documents, so
  # this is the cross-encoder survivor set rather than a padded round number.
  depth: 50

generation:
  backend: llm
  llm_backend: openai
  filename: "rag_output_trec_rag_2026.jsonl"
  evidence_k: 10
  max_words: 1024
  max_citations_per_sentence: 3

llm:
  base_url_env: "LLM_BASE_URL"
  api_key_env: "LLM_API_KEY"
  model_env: "LLM_MODEL"
  # Ollama is shared: if another process has a different model resident, our
  # request blocks behind a multi-GB model swap. Observed 578s for one topic and
  # a 300s read timeout on another, each costing the whole topic.
  timeout_seconds: 900
  max_attempts: 3
  retry_backoff_seconds: 10.0
