[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trecrag"
version = "0.1.0"
description = "TREC RAG 2026 submission pipeline: BM25+Biencoder -> LTR -> ColBERT -> CE -> LLM listwise -> Generator"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
neural = [
    "sentence-transformers>=2.6",
    "torch>=2.1",
    "transformers>=4.38",
]
ltr = [
    "lightgbm>=4.1",
]
llm = [
    "anthropic>=0.30",
    "openai>=1.30",
]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trecrag"]

[tool.hatch.metadata]
allow-direct-references = true
